services:

  db:
    image: postgres:16
    container_name: postgres_lab
    environment:
      POSTGRES_USER: damian
      POSTGRES_PASSWORD: damian
      POSTGRES_DB: vts
      TZ: Europe/Warsaw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d


  kafka:
    image: apache/kafka:latest
    container_name: kafka_lab

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_IP}:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      TZ: Europe/Warsaw

    ports:
      - "9092:9092"
      
      
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui

    ports:
      - "7000:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: vts-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka



  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch_lab

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Europe/Warsaw

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data



  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: kibana_lab

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Europe/Warsaw

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch



  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    environment:
      - TZ=Europe/Warsaw

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    restart: always



  osrm:
    image: osrm/osrm-backend
    container_name: nifty_williams

    environment:
      - TZ=Europe/Warsaw

    ports:
      - "5000:5000"

    volumes:
      - ./osrm:/data

    command: >
      osrm-routed
      --algorithm mld
      /data/mazowieckie-260629.osrm



  backend:
    build:
      context: ./backend

    container_name: vehicletracking_backend

    ports:
      - "8090:8090"


    environment:

      TZ: Europe/Warsaw

      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Warsaw"

      SERVER_PORT: 8090


      OSRM_HOST: http://osrm:5000
      OSRM_URL: http://osrm:5000


      DB_URL: jdbc:postgresql://db:5432/vts
      DB_USERNAME: damian
      DB_PASSWORD: damian


      ELASTICSEARCH_URL: http://elasticsearch:9200


      KAFKA_URL: kafka:9092


    depends_on:
      - db
      - osrm
      - elasticsearch
      - kafka



  simulator:
    build:
      context: ./simulator



    environment:

      TZ: Europe/Warsaw

      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Warsaw"


      KAFKA_URL: kafka:9092

      BACKEND_URL: http://backend:8090


      SERVER_PORT: 8060


    depends_on:

      - kafka
      - backend




  frontend:
    build:
      context: ./frontend

    container_name: vehicletracking_frontend


    environment:

      - TZ=Europe/Warsaw


    ports:
      - "8080:80"



volumes:

  grafana_data:

  postgres_data:

  elasticsearch_data: