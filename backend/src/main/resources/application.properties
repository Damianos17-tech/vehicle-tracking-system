spring.application.name=vehicletracking

server.port=${SERVER_PORT:8090}


# OSRM
osrm.host=${OSRM_HOST}
osrm.url=${OSRM_URL}


# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_URL}


# Kafka

spring.kafka.bootstrap-servers=192.168.1.130:9092


# CONSUMER simulator -> backend

spring.kafka.consumer.group-id=fleet-backend
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

#spring.kafka.consumer.properties.spring.json.trusted.packages=com.damianos.fleet.vehicletracking.model


spring.kafka.consumer.properties.spring.json.trusted.packages=*
#spring.kafka.consumer.properties.spring.json.use.type.headers=false



#spring.kafka.consumer.properties.spring.json.value.default.type=com.damianos.fleet.vehicletracking.model.Truck


# PRODUCER backend -> simulator

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=true


# Actuator

management.endpoints.web.exposure.include=health,metrics


# JVM

spring.jvm.options=${JVM_OPTIONS:-Xmx1024m}


spring.kafka.consumer.properties.spring.json.type.mapping=\
truck:com.damianos.fleet.vehicletracking.model.Truck,\
event:com.damianos.fleet.vehicletracking.model.TruckEvent


